module: role
module_title: 角色管理
dangerous:
  - POST /api/role/disable
  - POST /api/role/enable
  - POST /api/role/delete
menus:
  - key: roles
    title: 角色列表
    icon: team
    roles: [admin, developer]
    views: [role_list]
  - key: permissions
    title: 权限点
    icon: lock
    roles: [admin, developer]
    views: [permission_list]
views:
  - key: role_list
    type: table
    title: 角色
    api: GET /api/role/list
    columns:
      - field: role_id
        title: ID
        render: text
      - field: name
        title: 角色名
      - field: parent_name
        title: 父角色
      - field: description
        title: 说明
      - field: status
        title: 状态
        render: enum
        enum:
          enabled: 启用
          disabled: 禁用
      - field: created_at
        title: 创建时间
        render: datetime
    actions:
      - key: create
        type: page
        title: 新建角色
        api: POST /api/role/create
        fields:
          - field: name
            title: 角色名
            type: string
            required: true
            placeholder: 2-30 个字符
          - field: parent_role_id
            title: 父角色 ID
            type: string
            placeholder: 留空创建顶级角色，或填已有角色 ID
          - field: status
            title: 状态
            type: enum
            required: true
            default: enabled
            enum:
              enabled: 启用
              disabled: 禁用
          - field: description
            title: 说明
            type: text
          - field: permission_ids
            title: 权限点 ID 列表
            type: json
            default: []
            placeholder: '["权限点ID"]，留空数组表示不绑定'
      - key: edit
        type: row
        title: 编辑
        api: PUT /api/role/update
        fields:
          - field: role_id
            title: 角色 ID
            type: string
            hidden: true
            required: true
          - field: name
            title: 角色名
            type: string
            required: true
          - field: parent_id
            title: 父角色 ID
            type: string
            placeholder: 顶级角色留空
          - field: status
            title: 状态
            type: enum
            required: true
            enum:
              enabled: 启用
              disabled: 禁用
          - field: description
            title: 说明
            type: text
      - key: children_tree
        type: row
        title: 查看子角色
        target: role_children_tree
      - key: disable
        type: row
        title: 禁用
        api: POST /api/role/disable
        hide_when:
          field: name
          in: [超级管理员, 开发者, 运营]
        danger: true
        confirm: 确认禁用该角色？
        fields:
          - field: role_id
            title: 角色 ID
            type: string
            hidden: true
            required: true
      - key: enable
        type: row
        title: 启用
        api: POST /api/role/enable
        danger: true
        confirm: 确认启用该角色？
        fields:
          - field: role_id
            title: 角色 ID
            type: string
            hidden: true
            required: true
      - key: delete
        type: row
        title: 删除
        api: POST /api/role/delete
        hide_when:
          field: name
          in: [超级管理员, 开发者, 运营]
        danger: true
        confirm: 确认删除该角色及其全部子角色？
        fields:
          - field: role_id
            title: 角色 ID
            type: string
            hidden: true
            required: true
      - key: assign_permissions
        type: row
        title: 分配权限
        api: PUT /api/role/assign-permissions
        hide_when:
          field: name
          in: [超级管理员, 开发者]
        fields:
          - field: role_id
            title: 角色 ID
            type: string
            hidden: true
            required: true
          - field: permission_ids
            title: 权限点 ID 列表
            type: json
            required: true
            default: []
            placeholder: '["权限点ID"]，空数组表示清空权限'
  - key: role_children_tree
    type: detail
    title: 子角色树
    api: GET /api/role/children-tree
    fields:
      - field: role_id
        title: ID
      - field: name
        title: 角色名
      - field: parent_name
        title: 父角色
      - field: status
        title: 状态
      - field: description
        title: 说明
      - field: children_count
        title: 直接子角色数
      - field: children
        title: 子角色树
        type: json
  - key: permission_list
    type: table
    title: 权限点
    api: GET /api/role/permission-list
    columns:
      - field: permission_id
        title: ID
        render: short_id
      - field: code
        title: 权限码
      - field: name
        title: 名称
      - field: description
        title: 说明
    actions:
      - key: create
        type: page
        title: 新建权限点
        api: POST /api/role/permission-create
        fields:
          - field: code
            title: 权限码
            type: string
            required: true
            placeholder: 例如 role.manage
          - field: name
            title: 名称
            type: string
            required: true
          - field: description
            title: 说明
            type: text
roles:
  - code: admin
    title: 超级管理员
  - code: developer
    title: 开发者
