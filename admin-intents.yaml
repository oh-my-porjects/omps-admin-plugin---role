$schema: admin-ui-intent/v1
module: role

entities:
  - key: role.role
    module: role
    title: { fallback: 后台角色 }
    key_field: role_id
    fields:
      - { key: role_id, type: string }
      - { key: name, type: string }
      - { key: status, type: string }

pages:
  - key: role.list
    title: { fallback: 角色管理 }
    description: { fallback: 管理后台角色层级、状态和权限绑定。 }
    route: /system/roles
    menu_key: system.roles
    menu_title: { fallback: 角色管理 }
    menu_path:
      - { key: system, title: { fallback: 系统管理 }, icon: settings, order: 900 }
      - { key: system.access, title: { fallback: 账号与权限 }, icon: shield, order: 10 }
    icon: roles
    order: 110
    template: { id: standard-list, version: 1.0.0 }
    size: md
    query_capability: role.endpoint.get_api_role_list
    pagination: true
    selection: true
    filters:
      - key: keyword
        binding: keyword
        label: { fallback: 角色关键词 }
        control: search
      - key: status
        binding: status
        label: { fallback: 状态 }
        control: select
      - key: parent_id
        binding: parent_id
        label: { fallback: 父角色 ID }
        control: search
    columns:
      - field: role_id
        title: { fallback: 角色 ID }
        min_width: 180
      - field: name
        title: { fallback: 角色名 }
        min_width: 140
      - field: parent_name
        title: { fallback: 父角色 }
        min_width: 140
      - field: status
        title: { fallback: 状态 }
        renderer: enum
        min_width: 96
      - field: description
        title: { fallback: 说明 }
        min_width: 240
      - field: updated_at
        title: { fallback: 更新时间 }
        min_width: 180
    actions:
      - key: role.list.action.create
        type: open-dialog
        source: page
        title: { fallback: 新建角色 }
        overlay:
          type: open-dialog
          title: { fallback: 新建角色 }
          template: { id: standard-form, version: 1.0.0 }
          size: md
          fields:
            - binding: name
              label: { fallback: 角色名 }
              control: input
              required: true
            - binding: parent_id
              label: { fallback: 父角色 }
              control: select
              placeholder: { fallback: 留空表示顶级角色 }
              options_capability: role.endpoint.get_api_role_list
              options_query:
                page: { source: literal, value: 1 }
                page_size: { source: literal, value: 100 }
              options_items_path: data.items
              options_value_field: role_id
              options_label_fields: [name]
            - binding: description
              label: { fallback: 说明 }
              control: textarea
            - binding: status
              label: { fallback: 状态 }
              control: select
              required: true
              options:
                - value: enabled
                  label: { fallback: 启用 }
                - value: disabled
                  label: { fallback: 停用 }
            - binding: permission_ids
              label: { fallback: 权限点 }
              control: multi-select
              placeholder: { fallback: 选择要绑定的权限点 }
              options_capability: role.endpoint.get_api_role_permission_list
              options_query:
                page: { source: literal, value: 1 }
                page_size: { source: literal, value: 100 }
              options_items_path: data.items
              options_value_field: permission_id
              options_label_fields: [code, name]
          submit_action:
            key: role.list.action.create.submit
            type: submit
            source: form
            title: { fallback: 创建角色 }
            capability_key: role.endpoint.post_api_role_create
            danger: confirm
            confirm:
              title: { fallback: 确认创建角色？ }
              description: { fallback: 新角色将按状态和权限绑定立即参与后台访问控制。 }
            bindings:
              name: { source: form, key: name, required: true }
              parent_id: { source: form, key: parent_id }
              description: { source: form, key: description }
              status: { source: form, key: status, required: true, fallback: enabled }
              permission_ids: { source: form, key: permission_ids, fallback: [] }
      - key: role.list.action.detail
        type: open-dialog
        source: row
        title: { fallback: 查看 }
        bindings:
          role_id: { source: row, key: role_id, required: true }
        overlay:
          type: open-dialog
          title: { fallback: 角色详情 }
          template: { id: standard-detail, version: 1.0.0 }
          size: md
          detail_capability: role.endpoint.get_api_role_detail
          fields:
            - binding: role_id
              label: { fallback: 角色 ID }
            - binding: name
              label: { fallback: 角色名 }
            - binding: parent_name
              label: { fallback: 父角色 }
            - binding: status
              label: { fallback: 状态 }
            - binding: description
              label: { fallback: 说明 }
            - binding: permission_ids
              label: { fallback: 权限 ID 列表 }
              control: json
              renderer: structured
            - binding: updated_at
              label: { fallback: 更新时间 }
      - key: role.list.action.edit
        type: open-dialog
        source: row
        title: { fallback: 编辑 }
        bindings:
          role_id: { source: row, key: role_id, required: true }
        overlay:
          type: open-dialog
          title: { fallback: 编辑角色 }
          template: { id: standard-form, version: 1.0.0 }
          size: md
          detail_capability: role.endpoint.get_api_role_detail
          fields:
            - binding: name
              label: { fallback: 角色名 }
              control: input
              required: true
            - binding: parent_id
              label: { fallback: 父角色 }
              control: select
              options_capability: role.endpoint.get_api_role_list
              options_query:
                page: { source: literal, value: 1 }
                page_size: { source: literal, value: 100 }
              options_items_path: data.items
              options_value_field: role_id
              options_label_fields: [name]
            - binding: description
              label: { fallback: 说明 }
              control: textarea
            - binding: status
              label: { fallback: 状态 }
              control: select
              required: true
              options:
                - value: enabled
                  label: { fallback: 启用 }
                - value: disabled
                  label: { fallback: 停用 }
          submit_action:
            key: role.list.action.edit.submit
            type: submit
            source: form
            title: { fallback: 保存角色 }
            capability_key: role.endpoint.put_api_role_update
            danger: confirm
            confirm:
              title: { fallback: 确认更新角色？ }
              description: { fallback: 角色名称、层级和状态的变更会立即影响后台权限。 }
            bindings:
              role_id: { source: overlay, key: role_id, required: true }
              name: { source: form, key: name, required: true }
              parent_id: { source: form, key: parent_id }
              description: { source: form, key: description }
              status: { source: form, key: status, required: true }
      - key: role.list.action.permissions
        type: open-dialog
        source: row
        title: { fallback: 分配权限 }
        bindings:
          role_id: { source: row, key: role_id, required: true }
        overlay:
          type: open-dialog
          title: { fallback: 分配角色权限 }
          template: { id: standard-form, version: 1.0.0 }
          size: md
          detail_capability: role.endpoint.get_api_role_detail
          fields:
            - binding: permission_ids
              label: { fallback: 权限点 }
              control: multi-select
              required: true
              placeholder: { fallback: 选择要绑定的权限点 }
              options_capability: role.endpoint.get_api_role_permission_list
              options_query:
                page: { source: literal, value: 1 }
                page_size: { source: literal, value: 100 }
              options_items_path: data.items
              options_value_field: permission_id
              options_label_fields: [code, name]
          submit_action:
            key: role.list.action.permissions.submit
            type: submit
            source: form
            title: { fallback: 保存权限绑定 }
            capability_key: role.endpoint.put_api_role_assign_permissions
            danger: confirm
            confirm:
              title: { fallback: 确认更新角色权限？ }
              description: { fallback: 保存后将覆盖当前角色的权限绑定。 }
            bindings:
              role_id: { source: overlay, key: role_id, required: true }
              permission_ids: { source: form, key: permission_ids, required: true, fallback: [] }
      - key: role.list.action.disable
        type: submit
        source: row
        title: { fallback: 禁用 }
        capability_key: role.endpoint.post_api_role_disable
        danger: confirm
        confirm:
          title: { fallback: 确认禁用角色？ }
          description: { fallback: 禁用后依赖该角色的后台账号将失去相应权限。 }
        bindings:
          role_id: { source: row, key: role_id, required: true }
        visible_when:
          field: status
          operator: equals
          value: enabled
      - key: role.list.action.enable
        type: submit
        source: row
        title: { fallback: 启用 }
        capability_key: role.endpoint.post_api_role_enable
        danger: confirm
        confirm:
          title: { fallback: 确认启用角色？ }
          description: { fallback: 启用后该角色可重新作为后台账号权限来源。 }
        bindings:
          role_id: { source: row, key: role_id, required: true }
        visible_when:
          field: status
          operator: equals
          value: disabled
      - key: role.list.action.delete
        type: submit
        source: row
        title: { fallback: 删除 }
        capability_key: role.endpoint.post_api_role_delete
        danger: typed-confirm
        confirm:
          title: { fallback: 确认删除角色？ }
          description: { fallback: 删除会同时处理其子角色，且无法恢复。 }
        bindings:
          role_id: { source: row, key: role_id, required: true }

  - key: role.permission_list
    title: { fallback: 权限点 }
    description: { fallback: 查看角色模块提供的可分配权限点。 }
    route: /system/roles/permissions
    menu_key: system.role_permissions_catalog
    menu_title: { fallback: 角色权限点 }
    menu_path:
      - { key: system, title: { fallback: 系统管理 }, icon: settings, order: 900 }
      - { key: system.access, title: { fallback: 账号与权限 }, icon: shield, order: 10 }
    icon: key
    order: 111
    template: { id: standard-list, version: 1.0.0 }
    size: md
    query_capability: role.endpoint.get_api_role_permission_list
    pagination: true
    filters:
      - key: keyword
        binding: keyword
        label: { fallback: 权限关键词 }
        control: search
    columns:
      - field: permission_id
        title: { fallback: 权限 ID }
        min_width: 180
      - field: code
        title: { fallback: 权限码 }
        min_width: 220
      - field: name
        title: { fallback: 名称 }
        min_width: 160
      - field: description
        title: { fallback: 说明 }
        min_width: 240
      - field: created_at
        title: { fallback: 创建时间 }
        min_width: 180
    actions:
      - key: role.permission_list.action.create
        type: open-dialog
        source: page
        title: { fallback: 新建权限点 }
        overlay:
          type: open-dialog
          title: { fallback: 新建角色权限点 }
          template: { id: standard-form, version: 1.0.0 }
          size: md
          fields:
            - binding: code
              label: { fallback: 权限码 }
              control: input
              required: true
            - binding: name
              label: { fallback: 名称 }
              control: input
              required: true
            - binding: description
              label: { fallback: 说明 }
              control: textarea
          submit_action:
            key: role.permission_list.action.create.submit
            type: submit
            source: form
            title: { fallback: 创建权限点 }
            capability_key: role.endpoint.post_api_role_permission_create
            danger: confirm
            confirm:
              title: { fallback: 确认创建角色权限点？ }
              description: { fallback: 新权限点可在角色分配中使用。 }
            bindings:
              code: { source: form, key: code, required: true }
              name: { source: form, key: name, required: true }
              description: { source: form, key: description }
